<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUIZAPP</title>


    <!--bootstrap file -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <link rel="stylesheet" href="./style.css">


</head>

<body onload="init()">


    <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">QUIZ APP</span>
        </div>
    </nav>

    <div class="container">

        <div class="card quiz-card">

            <img src="./assets/img/Bild.jpg" id="header-image" class="card-img-top">

            <div id="quiz-progress" class="progress" role="progressbar" aria-label="Quiz-Fortschritt" aria-valuenow="0"
                aria-valuemin="0" aria-valuemax="100">

                <div id="progress-bar" class="progress-bar" style="width: 0%">
                    0 %
                </div>
            </div>

            <div class="card-body" id="endScreen" style="display: none;">

                <div class="text-center finalHeadline">
                    Quiz beendet!
                </div>

                <div class="text-center">
                    Du hast
                    <b id="amountofrightQuestions">0</b>
                    Fragen von
                    <b id="amountofQuestions">0</b>
                    Fragen richtig beantwortet.
                </div>

                <div class="button-row">
                    <button onclick="restartGame()" class="btn btn-primary">
                        Erneut spielen
                    </button>
                </div>

            </div>

            <div class="card-body" id="questionBody">

                <h5 class="card-title" id="questiontext">
                    Frage
                </h5>

                <div class="card quiz-answer-card mb-2" onclick="answer('answer_1')">
                    <div class="card-body" id="answer_1">
                        Antwort
                    </div>
                </div>

                <div class="card quiz-answer-card mb-2" onclick="answer('answer_2')">
                    <div class="card-body" id="answer_2">
                        Antwort
                    </div>
                </div>

                <div class="card quiz-answer-card mb-2" onclick="answer('answer_3')">
                    <div class="card-body" id="answer_3">
                        Antwort
                    </div>
                </div>

                <div class="card quiz-answer-card mb-2" onclick="answer('answer_4')">
                    <div class="card-body" id="answer_4">
                        Antwort
                    </div>
                </div>

                <div class="question-footer">

                    <span>
                        <b id="question-number">1</b> von
                        <b id="all-questions">5</b> Fragen
                    </span>

                    <button onclick="nextQuestion()" class="btn btn-primary" id="next-Button" disabled>
                        Nächste Frage
                    </button>

                </div>

            </div>

        </div>

    </div>

    <script src="./script.js"></script>
</body>

</html>
